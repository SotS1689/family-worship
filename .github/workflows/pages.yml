# Builds the app and publishes it to GitHub Pages
# (https://taylordrummond.org/family-worship/), and the church copy (see "church" below).
# Runs on every push to main, or by hand from the repo's Actions tab ("Run workflow").
name: Publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same build, also published for the church at
  # https://familyworship.gracecommunityallentown.org (GitHub Pages from the
  # gh-pages branch of SotS1689/family-worship-church). CHURCH_DEPLOY_KEY is the
  # private half of that repo's write-enabled deploy key.
  church:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - run: mkdir site && tar -xf artifact.tar -C site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.CHURCH_DEPLOY_KEY }}
          external_repository: SotS1689/family-worship-church
          publish_branch: gh-pages
          publish_dir: site
          cname: familyworship.gracecommunityallentown.org
          force_orphan: true
          commit_message: "Publish from SotS1689/family-worship"
